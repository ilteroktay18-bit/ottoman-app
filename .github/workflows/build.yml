name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33 pillow kivy

      - name: Build Info
        run: |
          echo "Kivy ve bagimliliklar yüklendi, iOS paketleme yapilandirmasi hazir."
