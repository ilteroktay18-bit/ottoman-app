name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33 pillow kivy

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          # Projedeki ana dosyayı Payload içine kopyalıyoruz
          cp telefon_arayuz.py Payload/main.py
          # .ipa arşivi oluşturuluyor
          zip -r ottoman_app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-ipa
          path: ottoman_app.ipa
