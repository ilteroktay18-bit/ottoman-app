name: Build iOS IPA

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create IPA Package
        run: |
          mkdir -p Payload/ottoman.app
          cp telefon_arayuz.py Payload/ottoman.app/main.py
          echo '#!/bin/bash' > Payload/ottoman.app/main
          echo 'python3 "$(dirname "$0")/main.py"' >> Payload/ottoman.app/main
          chmod +x Payload/ottoman.app/main
          
          echo '<?xml version="1.0" encoding="UTF-8"?>' > Payload/ottoman.app/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Payload/ottoman.app/Info.plist
          echo '<plist version="1.0"><dict>' >> Payload/ottoman.app/Info.plist
          echo '<key>CFBundleIdentifier</key><string>com.olter.ottoman</string>' >> Payload/ottoman.app/Info.plist
          echo '<key>CFBundleName</key><string>Ottoman</string>' >> Payload/ottoman.app/Info.plist
          echo '<key>CFBundleDisplayName</key><string>Ottoman</string>' >> Payload/ottoman.app/Info.plist
          echo '<key>CFBundleExecutable</key><string>main</string>' >> Payload/ottoman.app/Info.plist
          echo '<key>CFBundleVersion</key><string>1.0</string>' >> Payload/ottoman.app/Info.plist
          echo '<key>CFBundleShortVersionString</key><string>1.0</string>' >> Payload/ottoman.app/Info.plist
          echo '<key>CFBundlePackageType</key><string>APPL</string>' >> Payload/ottoman.app/Info.plist
          echo '<key>MinimumOSVersion</key><string>10.0</string>' >> Payload/ottoman.app/Info.plist
          echo '</dict></plist>' >> Payload/ottoman.app/Info.plist

          zip -r ottoman_app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ottoman_app.ipa
